<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermostats</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Thermostats</h1><button id="forget" type="button" hidden>Forget token</button></header>

<form id="login" hidden>
  <label for="token">Server token</label>
  <input id="token" type="password" autocomplete="off" required>
  <label class="check"><input id="remember" type="checkbox"> Remember it in this browser</label>
  <button type="submit">Open</button>
  <p>It is in <code>data/token.txt</code> on the server.</p>
</form>

<main id="main" hidden>
  <div class="filters">
    <label>Range
      <select id="range">
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="365">Last year</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <span id="custom" hidden>
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
    </span>
    <label class="check"><input id="setpoint" type="checkbox" checked> Show set points (thin lines)</label>
  </div>
  <div class="columns">
    <fieldset><legend>Thermostats</legend><div id="devices"></div></fieldset>
    <div class="content">
      <div id="charts"></div>
      <details id="tableBox"><summary>Table</summary><div id="table"></div></details>
    </div>
  </div>
</main>
<p id="message" role="status"></p>
<div id="tip" hidden></div>

<dialog id="controls" aria-labelledby="c-title">
  <header><h2 id="c-title"></h2><button id="c-close" type="button">Close</button></header>
  <p id="c-now"></p>
  <p id="c-error" class="problem" role="alert"></p>
  <div id="c-body">
    <div class="setpoint" role="group" aria-label="Set point">
      <button id="c-down" type="button" aria-label="Lower the set point">&minus;</button>
      <div><output id="c-set"></output> &deg;F</div>
      <button id="c-up" type="button" aria-label="Raise the set point">+</button>
    </div>
    <p id="c-lasts" hidden></p>
    <small id="c-set-status" role="status"></small>
    <div class="field" role="radiogroup" aria-label="Mode">
      <span>Mode</span>
      <span class="modes">
        <label class="check"><input type="radio" name="c-mode" value="heat"> Heat</label>
        <label class="check"><input type="radio" name="c-mode" value="off"> Off</label>
      </span>
      <small id="c-mode-status" role="status"></small>
    </div>
    <form id="c-form" novalidate>
      <div class="field"><label for="c-swing">Swing</label>
        <select id="c-swing"></select>
        <small id="c-swing-status" role="status"></small></div>
      <div class="field"><label for="c-offset">Sensor offset, &deg;F</label>
        <input id="c-offset" type="number" min="-10" max="10" step="0.1">
        <small id="c-offset-status" role="status"></small></div>
      <div class="field"><label for="c-name">Name</label>
        <input id="c-name" maxlength="16" autocomplete="off">
        <small id="c-name-status" role="status"></small></div>
      <fieldset><legend>Schedule</legend>
        <p id="c-none">No events.</p>
        <div id="c-schedule"></div>
        <button id="c-add" type="button">Add event</button>
        <small id="c-schedule-status" role="status"></small>
      </fieldset>
      <button type="submit">Save</button>
      <p id="c-problem" class="problem" role="alert"></p>
    </form>
  </div>
</dialog>
<script src="controls.js"></script>
<script src="app.js"></script>
</body>
</html>
