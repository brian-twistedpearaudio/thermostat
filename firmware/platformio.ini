; Thermostat firmware — LilyGO T-Display-S3 Touch
; Build/upload:  pio run -e t-display-s3 -t upload
; Logic tests:   pio test -e native

[platformio]
default_envs = t-display-s3

[env:t-display-s3]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2.2
    adafruit/Adafruit BME680 Library@^2.0.5
test_ignore = *
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    ; ---- TFT_eSPI setup for the T-Display-S3 (ST7789, 8-bit parallel) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D INIT_SEQUENCE_3=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH

; Runs the pure control/schedule logic tests on the PC (no hardware needed).
[env:native]
platform = native
test_framework = unity
test_filter = test_core
build_flags = -std=gnu++17
